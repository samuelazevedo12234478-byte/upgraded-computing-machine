<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Mão - Tela Cheia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }

    video {
      display: none;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    #errorLog {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff5555;
      font-size: 0.9rem;
      text-align: center;
      width: 90%;
      z-index: 10;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <button id="startBtn">Iniciar Câmera</button>
  <video id="webcam" playsinline></video>
  <canvas id="output_canvas"></canvas>
  <div id="errorLog"></div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const errorLog = document.getElementById('errorLog');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      // Ajusta o tamanho interno do canvas para a resolução da janela
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Desenha o feed da câmera cobrindo toda a dimensão do canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Desenha o esqueleto das mãos
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          
          for (const connection of HAND_CONNECTIONS) {
            const from = landmarks[connection[0]];
            const to = landmarks[connection[1]];
            
            canvasCtx.beginPath();
            canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
            canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
            canvasCtx.strokeStyle = '#00FF88';
            canvasCtx.lineWidth = 4;
            canvasCtx.stroke();
          }

          for (const landmark of landmarks) {
            const x = landmark.x * canvasElement.width;
            const y = landmark.y * canvasElement.height;

            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 6, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#FF0055';
            canvasCtx.fill();
          }
        }
      }
      canvasCtx.restore();
    });

    async function startCamera() {
      startBtn.style.display = 'none';
      errorLog.innerText = '';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        console.error(err);
        errorLog.innerText = "Erro ao acessar a câmera: " + err.message;
        startBtn.style.display = 'block';
      }
    }

    startBtn.addEventListener('click', startCamera);

    // Reajusta o tamanho do canvas se a tela for redimensionada ou girada
    window.addEventListener('resize', () => {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    });
  </script>
</body>
</html>
