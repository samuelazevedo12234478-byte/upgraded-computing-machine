<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest Spatial OS - A-Frame Edition</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Esconde a interface de VR padrão do A-Frame */
    .a-enter-vr { display: none !important; }

    /* Canvas para a Mão e Laser (Sobreposto) */
    #hand_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      pointer-events: none;
    }

    /* Interface da Janela 3D (Substitui os iframes para compatibilidade 3D) */
    .spatial-card {
      width: 400px;
      height: 260px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 20px;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.5);
    }

    #statusLog {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      color: #cbd5e1;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.88);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    video { display: none; }
  </style>
</head>
<body>

  <button id="startBtn">Iniciar AR Espacial 3D</button>
  <div id="statusLog">A-Frame Spatial 3D Pronto!</div>
  
  <video id="webcam" playsinline></video>
  <canvas id="hand_canvas"></canvas>

  <a-scene embedded vr-mode-ui="enabled: false">
    
    <a-entity id="main-camera" camera look-controls="magicWindowTrackingEnabled: true"></a-entity>

    <a-entity id="spatial-world">
      
      <a-plane id="window-wiki" position="0 0 -2" width="1.6" height="1" material="shader: flat; color: #0f172a; opacity: 0.9; transparent: true">
        <a-text value="Wikipedia AR" position="-0.7 0.35 0.01" scale="0.5 0.5 0.5" color="#38bdf8"></a-text>
        <a-text value="Seja bem-vindo ao espaco 3D!\nEsta janela esta flutuando no ambiente." position="-0.7 0.1 0.01" scale="0.3 0.3 0.3" color="#ffffff"></a-text>
      </a-plane>

      <a-plane id="dock-menu" position="0 -0.8 -1.5" width="1.2" height="0.3" material="shader: flat; color: #1e293b; opacity: 0.9; transparent: true">
        <a-text value="[ Busca ]" position="-0.4 0 0.01" scale="0.4 0.4 0.4" color="#38bdf8"></a-text>
        <a-text value="[ Wikipedia ]" position="0.1 0 0.01" scale="0.4 0.4 0.4" color="#22c55e"></a-text>
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('statusLog');

    let smoothPointerX = window.innerWidth / 2;
    let smoothPointerY = window.innerHeight / 2;
    let isPinching = false;

    // Configuração do MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;

      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // 1. Desenha esqueleto da Mão
        drawHandMesh(landmarks);

        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];
        const indexBase = landmarks[5];
        const middleTip = landmarks[12];

        // 2. Calcula Mira do Laser
        const originX = indexTip.x * handCanvas.width;
        const originY = indexTip.y * handCanvas.height;
        const dirX = (indexTip.x - indexBase.x) * 3.5;
        const dirY = (indexTip.y - indexBase.y) * 3.5;

        const targetX = (indexTip.x + dirX) * handCanvas.width;
        const targetY = (indexTip.y + dirY) * handCanvas.height;

        smoothPointerX += (targetX - smoothPointerX) * 0.25;
        smoothPointerY += (targetY - smoothPointerY) * 0.25;

        // 3. Detecção de Pinça
        const palmWidth = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        const pinchDistance = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y);
        isPinching = (pinchDistance / palmWidth) < 0.32;

        // Desenha o Feixe
        drawLaserRay(originX, originY, smoothPointerX, smoothPointerY, isPinching);
      }

      handCtx.restore();
    });

    function drawHandMesh(landmarks) {
      for (const connection of HAND_CONNECTIONS) {
        const from = landmarks[connection[0]];
        const to = landmarks[connection[1]];
        handCtx.beginPath();
        handCtx.moveTo(from.x * handCanvas.width, from.y * handCanvas.height);
        handCtx.lineTo(to.x * handCanvas.width, to.y * handCanvas.height);
        handCtx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        handCtx.lineWidth = 3;
        handCtx.stroke();
      }
    }

    function drawLaserRay(startX, startY, endX, endY, pinching) {
      let colorCore = pinching ? '#22c55e' : '#38bdf8';
      
      handCtx.beginPath();
      handCtx.moveTo(startX, startY);
      handCtx.lineTo(endX, endY);
      handCtx.strokeStyle = colorCore;
      handCtx.lineWidth = pinching ? 6 : 3;
      handCtx.stroke();

      handCtx.beginPath();
      handCtx.arc(endX, endY, pinching ? 6 : 9, 0, 2 * Math.PI);
      handCtx.fillStyle = colorCore;
      handCtx.fill();
    }

    async function startApp() {
      startBtn.style.display = 'none';

      // Solicita permissão para o Giroscópio
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch(e) {}
      }

      // Inicia a Câmera para o Rastreamento
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();
        statusLog.innerText = "Modo Espacial Ativo! Move o celular e use a mão.";
      } catch (err) {
        statusLog.innerText = "Erro ao abrir câmera: " + err.message;
      }
    }

    startBtn.addEventListener('click', startApp);
  </script>
</body>
</html>
