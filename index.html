<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegação AR 3D - Câmera Traseira & Giroscópio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    video {
      display: none;
    }

    /* Painel 3D ao fundo (Z-Index 1) */
    #viewport-3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #ui-panel {
      width: 80%;
      max-width: 600px;
      padding: 25px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    #ui-title {
      color: #f1f5f9;
      font-size: 1.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .vr-btn {
      padding: 16px 8px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      transition: all 0.15s ease;
    }

    .vr-btn.hovered {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(14, 165, 233, 0.6));
      border-color: #38bdf8;
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }

    .vr-btn.active {
      background: #22c55e !important;
      border-color: #4ade80 !important;
      color: #fff !important;
      transform: scale(0.95) !important;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.9) !important;
    }

    /* Canvas da Câmera, Esqueleto e Raio NA FRENTE (Z-Index 2) */
    #output_canvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.5);
      cursor: pointer;
    }

    #statusLog {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #94a3b8;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.8);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <button id="startBtn">Iniciar Câmera Traseira</button>
  <video id="webcam" playsinline></video>

  <div id="viewport-3d">
    <div id="ui-panel">
      <div id="ui-title">Painel AR Espacial</div>
      <div class="button-grid">
        <div class="vr-btn" data-id="1">Botão 01</div>
        <div class="vr-btn" data-id="2">Botão 02</div>
        <div class="vr-btn" data-id="3">Botão 03</div>
        <div class="vr-btn" data-id="4">Botão 04</div>
        <div class="vr-btn" data-id="5">Botão 05</div>
        <div class="vr-btn" data-id="6">Botão 06</div>
      </div>
    </div>
  </div>

  <canvas id="output_canvas"></canvas>

  <div id="statusLog">Mira com o indicador. Junte o polegar + dedo do meio para clicar!</div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('statusLog');
    const uiPanel = document.getElementById('ui-panel');
    const vrButtons = document.querySelectorAll('.vr-btn');

    let wasPinching = false;
    let smoothPointerX = window.innerWidth / 2;
    let smoothPointerY = window.innerHeight / 2;

    // Ângulos do Giroscópio (Sensores do Celular)
    let gyroRotateX = 0, gyroRotateY = 0;
    let currentRotateX = 0, currentRotateY = 0;

    // Leitura do Giroscópio em TODAS as direções
    window.addEventListener('deviceorientation', (event) => {
      if (event.beta !== null && event.gamma !== null) {
        // beta: inclinação frente/trás (-180 a 180)
        // gamma: inclinação esquerda/direita (-90 a 90)
        gyroRotateX = Math.max(-30, Math.min(30, (event.beta - 45) * 0.5));
        gyroRotateY = Math.max(-30, Math.min(30, event.gamma * 0.5));
      }
    });

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Renderiza a câmera traseira no fundo do Canvas
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      let isHoveringAny = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // 1. DESENHA A MÃO NA FRENTE DO PAINEL
        drawHandMesh(landmarks);

        const thumbTip = landmarks[4];   // Polegar
        const indexTip = landmarks[8];   // Indicador (De onde sai o laser)
        const indexBase = landmarks[5];  // Base do indicador
        const middleTip = landmarks[12]; // DEDO DO MEIO (NOVO DEDO DE CLIQUE)

        // 2. MIRA LASER (Projeção contínua pelo Indicador)
        const originX = indexTip.x * canvasElement.width;
        const originY = indexTip.y * canvasElement.height;

        const dirX = (indexTip.x - indexBase.x) * 3.5;
        const dirY = (indexTip.y - indexBase.y) * 3.5;

        const targetX = (indexTip.x + dirX) * canvasElement.width;
        const targetY = (indexTip.y + dirY) * canvasElement.height;

        smoothPointerX += (targetX - smoothPointerX) * 0.25;
        smoothPointerY += (targetY - smoothPointerY) * 0.25;

        // 3. NOVA PINÇA: POLEGAR (4) + DEDO DO MEIO (12)
        const palmWidth = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        const pinchDistance = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y);
        
        // Ativa se a distância entre polegar e dedo do meio for menor que 30% da largura da mão
        const isPinching = (pinchDistance / palmWidth) < 0.32;

        // 4. TESTE DE INTERAÇÃO COM OS BOTÕES
        vrButtons.forEach(btn => {
          const rect = btn.getBoundingClientRect();

          const isInside = smoothPointerX >= rect.left && 
                           smoothPointerX <= rect.right && 
                           smoothPointerY >= rect.top && 
                           smoothPointerY <= rect.bottom;

          if (isInside) {
            isHoveringAny = true;
            btn.classList.add('hovered');

            if (isPinching && !wasPinching) {
              btn.classList.add('active');
              statusLog.innerText = `Clicou no ${btn.innerText}!`;
              setTimeout(() => btn.classList.remove('active'), 250);
            }
          } else {
            btn.classList.remove('hovered');
          }
        });

        // 5. DESENHA O RAIO LASER E MIRA NA FRENTE DO PAINEL
        drawLaserRay(originX, originY, smoothPointerX, smoothPointerY, isPinching, isHoveringAny);
        wasPinching = isPinching;

      } else {
        vrButtons.forEach(btn => btn.classList.remove('hovered'));
        wasPinching = false;
      }

      // Aplica a inclinação 3D do Giroscópio no painel
      currentRotateX += (gyroRotateX - currentRotateX) * 0.1;
      currentRotateY += (gyroRotateY - currentRotateY) * 0.1;
      uiPanel.style.transform = `rotateX(${-currentRotateX}deg) rotateY(${currentRotateY}deg)`;

      canvasCtx.restore();
    });

    function drawHandMesh(landmarks) {
      for (const connection of HAND_CONNECTIONS) {
        const from = landmarks[connection[0]];
        const to = landmarks[connection[1]];

        canvasCtx.beginPath();
        canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
        canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
        canvasCtx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
        canvasCtx.lineWidth = 3;
        canvasCtx.stroke();
      }

      for (const landmark of landmarks) {
        canvasCtx.beginPath();
        canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 5, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#38bdf8';
        canvasCtx.fill();
      }
    }

    function drawLaserRay(startX, startY, endX, endY, isPinching, isHovering) {
      let colorCore = isPinching ? '#22c55e' : (isHovering ? '#38bdf8' : '#ffffff');
      let colorGlow = isPinching ? 'rgba(34, 197, 94, 0.8)' : (isHovering ? 'rgba(56, 189, 248, 0.8)' : 'rgba(14, 165, 233, 0.4)');

      // Raio Neon 外 (Glow)
      canvasCtx.beginPath();
      canvasCtx.moveTo(startX, startY);
      canvasCtx.lineTo(endX, endY);
      canvasCtx.strokeStyle = colorGlow;
      canvasCtx.lineWidth = isPinching ? 9 : 5;
      canvasCtx.shadowColor = colorCore;
      canvasCtx.shadowBlur = 12;
      canvasCtx.stroke();

      // Centro do Feixe
      canvasCtx.beginPath();
      canvasCtx.moveTo(startX, startY);
      canvasCtx.lineTo(endX, endY);
      canvasCtx.strokeStyle = '#ffffff';
      canvasCtx.lineWidth = 2;
      canvasCtx.stroke();
      canvasCtx.shadowBlur = 0;

      // Mira Holográfica
      canvasCtx.beginPath();
      canvasCtx.arc(endX, endY, isPinching ? 6 : 9, 0, 2 * Math.PI);
      canvasCtx.fillStyle = colorCore;
      canvasCtx.fill();

      canvasCtx.beginPath();
      canvasCtx.arc(endX, endY, isPinching ? 12 : 16, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = colorCore;
      canvasCtx.lineWidth = 2;
      canvasCtx.stroke();
    }

    async function startCamera() {
      startBtn.style.display = 'none';

      // Solicita permissão para o giroscópio (iOS / Android)
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (e) {
          console.log("Giroscópio liberado por padrão");
        }
      }

      try {
        // Câmera Traseira ativada por padrão
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        }).catch(() => {
          // Fallback caso a câmera traseira exata não responda
          return navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
        });
        
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        console.error(err);
        statusLog.innerText = "Erro ao acessar a câmera: " + err.message;
        startBtn.style.display = 'block';
      }
    }

    startBtn.addEventListener('click', startCamera);

    window.addEventListener('resize', () => {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    });
  </script>
</body>
</html>
