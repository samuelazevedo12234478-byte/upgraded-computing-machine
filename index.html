<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest AR - Menu de Jogos (Tiro & Homem-Aranha)</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .a-enter-vr { display: none !important; }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }

    #hand_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.5);
    }

    /* MENU DE ESCOLHA DE JOGOS */
    #menu-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: none;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 24px;
      border-radius: 40px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .game-btn {
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      cursor: pointer;
      background: rgba(30, 41, 59, 0.9);
      transition: all 0.2s;
    }

    .game-btn.gun { background: rgba(16, 185, 129, 0.85); }
    .game-btn.spider { background: rgba(239, 68, 68, 0.85); }
    .game-btn.back { background: rgba(100, 116, 139, 0.85); }

    #statusLog {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.88);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <button id="startBtn">🎮 Iniciar Sistema AR</button>
  
  <div id="menu-container">
    <button class="game-btn gun" id="btnPlayGun">🔫 Jogo da Arma</button>
    <button class="game-btn spider" id="btnPlaySpider">🕷️ Jogo da Teia</button>
    <button class="game-btn back" id="btnBackMenu" style="display:none;">🏠 Menu</button>
  </div>

  <div id="statusLog">Toque para ativar o sistema AR!</div>
  
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="hand_canvas"></canvas>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
    <a-entity id="main-camera" camera look-controls="enabled: true; magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>

    <a-entity id="gun-game-group" visible="false">
      <a-entity id="gun-model" position="0 -0.2 -0.8">
        <a-box position="0 0 0" width="0.08" height="0.12" depth="0.3" material="color: #1e293b; metalness: 0.8; roughness: 0.2;"></a-box>
        <a-cylinder position="0 0.03 -0.2" radius="0.025" height="0.25" rotation="90 0 0" material="color: #0284c7; metalness: 0.9;"></a-cylinder>
        <a-box position="0 -0.09 0.05" width="0.06" height="0.12" depth="0.08" rotation="-20 0 0" material="color: #0f172a;"></a-box>
        <a-cylinder position="0 0.03 -1.25" radius="0.004" height="2" rotation="90 0 0" material="color: #ef4444; opacity: 0.6; transparent: true; shader: flat;"></a-cylinder>
      </a-entity>

      <a-entity id="target-monster" position="0 0.2 -2.5">
        <a-sphere radius="0.2" material="color: #22c55e; roughness: 0.3;"></a-sphere>
        <a-sphere position="-0.07 0.05 0.16" radius="0.04" material="color: #ffffff;"></a-sphere>
        <a-sphere position="0.07 0.05 0.16" radius="0.04" material="color: #ffffff;"></a-sphere>
        <a-sphere position="-0.07 0.05 0.19" radius="0.02" material="color: #000000;"></a-sphere>
        <a-sphere position="0.07 0.05 0.19" radius="0.02" material="color: #000000;"></a-sphere>
        <a-box position="0 -0.2 0" width="0.6" height="0.05" depth="0.6" material="color: #38bdf8; opacity: 0.3; transparent: true;"></a-box>
      </a-entity>
    </a-entity>

    <a-entity id="spider-game-group" visible="false">
      <a-box id="spider-item" position="0 0.5 -2.2" width="0.3" height="0.3" depth="0.3" material="color: #ef4444; metalness: 0.5;"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    
    const startBtn = document.getElementById('startBtn');
    const menuContainer = document.getElementById('menu-container');
    const statusLog = document.getElementById('statusLog');
    
    const btnPlayGun = document.getElementById('btnPlayGun');
    const btnPlaySpider = document.getElementById('btnPlaySpider');
    const btnBackMenu = document.getElementById('btnBackMenu');

    const gunGameGroup = document.getElementById('gun-game-group');
    const spiderGameGroup = document.getElementById('spider-game-group');
    const gunModel = document.getElementById('gun-model');
    const targetMonster = document.getElementById('target-monster');
    const spiderItem = document.getElementById('spider-item');

    let currentMode = 'menu'; // 'menu', 'gun', 'spider'
    let isHoldingGun = false;
    let isPinching = false;
    let wasPinching = false;

    // VARIÁVEIS DO JOGO DO HOMEM-ARANHA
    let spiderWebActive = false;
    let itemPulled = false;
    let itemPullProgress = 0;
    let startPullPos = { x: 0, y: 0, z: 0 };

    // SELEÇÃO DE JOGOS NO MENU
    btnPlayGun.addEventListener('click', () => {
      currentMode = 'gun';
      gunGameGroup.setAttribute('visible', 'true');
      spiderGameGroup.setAttribute('visible', 'false');
      btnPlayGun.style.display = 'none';
      btnPlaySpider.style.display = 'none';
      btnBackMenu.style.display = 'block';
      statusLog.innerText = "🔫 Jogo da Arma Ativo! Feche a mão para pegar.";
    });

    btnPlaySpider.addEventListener('click', () => {
      currentMode = 'spider';
      gunGameGroup.setAttribute('visible', 'false');
      spiderGameGroup.setAttribute('visible', 'true');
      btnPlayGun.style.display = 'none';
      btnPlaySpider.style.display = 'none';
      btnBackMenu.style.display = 'block';
      statusLog.innerText = "🕷️ Jogo da Teia Ativo! Feche a mão para pegar o cubo.";
    });

    btnBackMenu.addEventListener('click', () => {
      currentMode = 'menu';
      gunGameGroup.setAttribute('visible', 'false');
      spiderGameGroup.setAttribute('visible', 'false');
      btnPlayGun.style.display = 'block';
      btnPlaySpider.style.display = 'block';
      btnBackMenu.style.display = 'none';
      isHoldingGun = false;
      spiderWebActive = false;
      itemPulled = false;
      statusLog.innerText = "Escolha um jogo abaixo!";
    });

    // MEDIAPIPE HANDS
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;

      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        drawHandMesh(landmarks);

        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];
        const middleTip = landmarks[12];
        const ringTip = landmarks[16];
        const pinkyTip = landmarks[20];
        const wrist = landmarks[0];
        const middleBase = landmarks[9];

        // GESTOS COMUNS
        const isHandClosed = (
          Math.hypot(indexTip.x - middleBase.x, indexTip.y - middleBase.y) < 0.12 &&
          Math.hypot(middleTip.x - middleBase.x, middleTip.y - middleBase.y) < 0.12 &&
          Math.hypot(ringTip.x - middleBase.x, ringTip.y - middleBase.y) < 0.12
        );

        const isIndexExtended = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) > 0.35;
        const isPinkyExtended = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y) > 0.30;
        const isMiddleFolded = Math.hypot(middleTip.x - middleBase.x, middleTip.y - middleBase.y) < 0.15;
        const isRingFolded = Math.hypot(ringTip.x - middleBase.x, ringTip.y - middleBase.y) < 0.15;
        const isSpiderManGesture = isIndexExtended && isPinkyExtended && isMiddleFolded && isRingFolded;

        const palmWidth = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        const pinchDistance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
        isPinching = (pinchDistance / palmWidth) < 0.35;

        // LÓGICA DO JOGO DA ARMA
        if (currentMode === 'gun') {
          if (isHandClosed && !isHoldingGun) {
            isHoldingGun = true;
            statusLog.innerText = "🔫 Arma Pega! Faça pinça para atirar.";
          } else if (isSpiderManGesture && isHoldingGun) {
            isHoldingGun = false;
            statusLog.innerText = "🕸️ Arma Solta!";
          }

          if (isHoldingGun) {
            const posX = (middleBase.x - 0.5) * 2.2;
            const posY = -(middleBase.y - 0.5) * 1.8 - 0.1;
            const posZ = -0.7;

            gunModel.object3D.position.set(posX, posY, posZ);
            const dirVecX = (middleBase.x - wrist.x) * 2;
            const dirVecY = -(middleBase.y - wrist.y) * 2;
            gunModel.object3D.rotation.set(dirVecY, dirVecX, 0);

            if (isPinching && !wasPinching) {
              shootLaser(posX, posY, posZ, dirVecX, dirVecY);
            }
          }
        }

        // LÓGICA DO JOGO DO HOMEM-ARANHA (TEIA)
        if (currentMode === 'spider') {
          const handX = (middleBase.x - 0.5) * 2.2;
          const handY = -(middleBase.y - 0.5) * 1.8 - 0.1;
          const handZ = -0.7;

          // Fechar a mão pega o cubo vermelho
          if (isHandClosed && !isHoldingGun && !itemPulled) {
            isHoldingGun = true;
            statusLog.innerText = "🔴 Cubo fixado! Faça pinça ou atire a teia.";
          }

          // Atirar teia (Pinça) gruda e puxa o cubo fluidamente para a mão
          if (isPinching && isHoldingGun && !spiderWebActive && !itemPulled) {
            spiderWebActive = true;
            itemPullProgress = 0;
            const currentItemPos = spiderItem.object3D.position;
            startPullPos = { x: currentItemPos.x, y: currentItemPos.y, z: currentItemPos.z };
            statusLog.innerText = "🕸️ Teia disparada! Puxando item...";
          }

          // Animação da teia puxando o cubo de forma realista até a mão
          if (spiderWebActive) {
            itemPullProgress += 0.05; // Velocidade de puxada
            if (itemPullProgress >= 1.0) {
              itemPullProgress = 1.0;
              spiderWebActive = false;
              itemPulled = true;
              statusLog.innerText = "📦 Cubo veio para a sua mão! Abra a mão (Homem-Aranha) para resetar.";
            }

            // Faz o item se mover em direção à mão com curva suave
            const targetX = startPullPos.x + (handX - startPullPos.x) * itemPullProgress;
            const targetY = startPullPos.y + (handY - startPullPos.y) * itemPullProgress;
            const targetZ = startPullPos.z + (handZ - startPullPos.z) * itemPullProgress;
            spiderItem.object3D.position.set(targetX, targetY, targetZ);

            // Desenhar a linha da teia visível na tela
            drawSpiderWebLine(middleBase.x * handCanvas.width, middleBase.y * handCanvas.height, window.innerWidth / 2, window.innerHeight / 2);
          }

          // Gesto do Homem-Aranha reseta o cubo para longe
          if (isSpiderManGesture && itemPulled) {
            isHoldingGun = false;
            itemPulled = false;
            spiderItem.object3D.position.set((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 1 + 0.5, -2.5);
            statusLog.innerText = "🕸️ Cubo resetado! Feche a mão para pegar de novo.";
          }
        }

        wasPinching = isPinching;
      }

      handCtx.restore();
    });

    // TIRO DA ARMA
    function shootLaser(startX, startY, startZ, dirX, dirY) {
      statusLog.innerText = "💥 POW!";
      const scene = document.querySelector('a-scene');
      const bullet = document.createElement('a-sphere');
      bullet.setAttribute('radius', '0.035');
      bullet.setAttribute('material', 'color: #ef4444; shader: flat;');
      bullet.setAttribute('position', `${startX} ${startY + 0.03} ${startZ - 0.2}`);
      scene.appendChild(bullet);

      let bulletX = startX;
      let bulletY = startY + 0.03;
      let bulletZ = startZ - 0.2;
      const stepX = dirX * 0.03;
      const stepY = dirY * 0.03;

      const interval = setInterval(() => {
        bulletZ -= 0.1;
        bulletX += stepX;
        bulletY += stepY;
        bullet.setAttribute('position', `${bulletX} ${bulletY} ${bulletZ}`);

        const monsterPos = targetMonster.object3D.position;
        const dist = Math.hypot(bulletX - monsterPos.x, bulletY - monsterPos.y, bulletZ - monsterPos.z);

        if (dist < 0.3) {
          statusLog.innerText = "🎯 ACERTOU O ALVO!";
          targetMonster.object3D.position.set((Math.random() - 0.5) * 3, -0.2, -2.5 + (Math.random() - 0.5) * 1.5);
          clearInterval(interval);
          bullet.remove();
        }

        if (bulletZ < -5) {
          clearInterval(interval);
          bullet.remove();
        }
      }, 30);
    }

    // DESENHAR LINHA DA TEIA NA TELA
    function drawSpiderWebLine(startX, startY, endX, endY) {
      handCtx.beginPath();
      handCtx.moveTo(startX, startY);
      handCtx.lineTo(endX, endY);
      handCtx.strokeStyle = '#ffffff';
      handCtx.lineWidth = 4;
      handCtx.stroke();
    }

    function drawHandMesh(landmarks) {
      for (const connection of HAND_CONNECTIONS) {
        const from = landmarks[connection[0]];
        const to = landmarks[connection[1]];
        handCtx.beginPath();
        handCtx.moveTo(from.x * handCanvas.width, from.y * handCanvas.height);
        handCtx.lineTo(to.x * handCanvas.width, to.y * handCanvas.height);
        handCtx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        handCtx.lineWidth = 3;
        handCtx.stroke();
      }
    }

    async function startApp() {
      startBtn.style.display = 'none';
      menuContainer.style.display = 'flex';

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();
        statusLog.innerText = "🎮 Sistema AR pronto! Escolha um jogo abaixo.";
      } catch (err) {
        statusLog.innerText = "⚠️ Erro ao acessar a câmera.";
      }
    }

    startBtn.addEventListener('click', startApp);
  </script>
</body>
</html>
