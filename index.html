<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest OS - Interface Fixa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    video {
      display: none;
    }

    /* Camada 1: Câmera + Esqueleto + Laser */
    #output_canvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Camada 2: Container para as Janelas Abertas */
    #windows-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    /* Camada 3: Dock de Aplicativos (SEMPRE NA FRENTE) */
    #main-dock {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 50;
      pointer-events: auto;
    }

    .dock-btn {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .dock-btn.hovered {
      background: rgba(56, 189, 248, 0.5);
      border-color: #38bdf8;
      transform: scale(1.06);
    }

    /* Estilo das Janelas Abertas */
    .app-window {
      position: absolute;
      width: 88vw;
      max-width: 480px;
      height: 320px;
      background: rgba(20, 25, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
    }

    .window-header {
      height: 38px;
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      color: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .close-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ef4444;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .window-body {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .window-grab-bar {
      height: 20px;
      background: rgba(15, 23, 42, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grab-pill {
      width: 120px;
      height: 5px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 10px;
    }

    .grab-pill.hovered {
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.5);
    }

    #statusLog {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      color: #cbd5e1;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.88);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <button id="startBtn">Iniciar Meta Quest AR</button>
  <video id="webcam" playsinline></video>

  <canvas id="output_canvas"></canvas>

  <div id="windows-container"></div>

  <div id="main-dock">
    <div class="dock-btn" data-app="Google Busca" data-url="https://html.duckduckgo.com/html/">🌐 Google / Busca</div>
    <div class="dock-btn" data-app="Wikipédia" data-url="https://pt.m.wikipedia.org">📚 Wikipédia</div>
  </div>

  <div id="statusLog">Aponte o laser e pince para usar!</div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const statusLog = document.getElementById('statusLog');
    const windowsContainer = document.getElementById('windows-container');
    const dockButtons = document.querySelectorAll('.dock-btn');

    let wasPinching = false;
    let activeDraggingWindow = null;
    let isContentScrolling = false;
    
    let pinchStartTime = 0;
    let pinchStartX = 0, pinchStartY = 0;
    let lastPinchY = 0;
    let dragOffsetX = 0, dragOffsetY = 0;

    let smoothPointerX = window.innerWidth / 2;
    let smoothPointerY = window.innerHeight / 2;

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      let isHoveringAny = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        drawHandMesh(landmarks);

        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];
        const indexBase = landmarks[5];
        const middleTip = landmarks[12];

        // Feixe Laser
        const originX = indexTip.x * canvasElement.width;
        const originY = indexTip.y * canvasElement.height;
        const dirX = (indexTip.x - indexBase.x) * 3.5;
        const dirY = (indexTip.y - indexBase.y) * 3.5;

        const targetX = (indexTip.x + dirX) * canvasElement.width;
        const targetY = (indexTip.y + dirY) * canvasElement.height;

        smoothPointerX += (targetX - smoothPointerX) * 0.25;
        smoothPointerY += (targetY - smoothPointerY) * 0.25;

        // Pinça
        const palmWidth = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        const pinchDistance = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y);
        const isPinching = (pinchDistance / palmWidth) < 0.32;

        const now = Date.now();

        if (isPinching && !wasPinching) {
          pinchStartTime = now;
          pinchStartX = smoothPointerX;
          pinchStartY = smoothPointerY;
          lastPinchY = smoothPointerY;
        }

        const pinchDuration = isPinching ? (now - pinchStartTime) : 0;
        const movedDistance = Math.hypot(smoothPointerX - pinchStartX, smoothPointerY - pinchStartY);

        // 1. Interagir com o Dock de Botões
        if (!activeDraggingWindow && !isContentScrolling) {
          dockButtons.forEach(btn => {
            const rect = btn.getBoundingClientRect();
            if (smoothPointerX >= rect.left && smoothPointerX <= rect.right &&
                smoothPointerY >= rect.top && smoothPointerY <= rect.bottom) {
              isHoveringAny = true;
              btn.classList.add('hovered');
              if (isPinching && !wasPinching) {
                createAppWindow(btn.dataset.app, btn.dataset.url);
                statusLog.innerText = "Janela " + btn.dataset.app + " aberta!";
              }
            } else {
              btn.classList.remove('hovered');
            }
          });
        }

        // 2. Interagir com as Janelas
        const allWindows = document.querySelectorAll('.app-window');
        allWindows.forEach(win => {
          const iframe = win.querySelector('.window-body');
          const grabPill = win.querySelector('.grab-pill');
          const closeBtn = win.querySelector('.close-btn');

          if (closeBtn) {
            const cRect = closeBtn.getBoundingClientRect();
            if (smoothPointerX >= cRect.left && smoothPointerX <= cRect.right &&
                smoothPointerY >= cRect.top && smoothPointerY <= cRect.bottom) {
              isHoveringAny = true;
              if (isPinching && !wasPinching) win.remove();
            }
          }

          if (grabPill) {
            const gRect = grabPill.getBoundingClientRect();
            if (smoothPointerX >= gRect.left && smoothPointerX <= gRect.right &&
                smoothPointerY >= gRect.top && smoothPointerY <= gRect.bottom) {
              grabPill.classList.add('hovered');
              isHoveringAny = true;

              if (isPinching && !wasPinching && !activeDraggingWindow) {
                activeDraggingWindow = win;
                const winRect = win.getBoundingClientRect();
                dragOffsetX = winRect.left - smoothPointerX;
                dragOffsetY = winRect.top - smoothPointerY;
              }
            } else if (activeDraggingWindow !== win) {
              grabPill.classList.remove('hovered');
            }
          }

          // Rolagem & Clique Interno
          const wRect = win.getBoundingClientRect();
          const isInsideBody = smoothPointerX >= wRect.left && smoothPointerX <= wRect.right &&
                               smoothPointerY >= (wRect.top + 38) && smoothPointerY <= (wRect.bottom - 20);

          if (isInsideBody && !activeDraggingWindow) {
            isHoveringAny = true;

            if (isPinching && (pinchDuration > 300 || movedDistance > 15)) {
              isContentScrolling = true;
              const deltaY = lastPinchY - smoothPointerY;
              try {
                iframe.contentWindow.scrollBy(0, deltaY * 2.5);
              } catch(e) {}
              lastPinchY = smoothPointerY;
            }
          }
        });

        if (activeDraggingWindow) {
          if (isPinching) {
            isHoveringAny = true;
            activeDraggingWindow.style.left = `${smoothPointerX + dragOffsetX}px`;
            activeDraggingWindow.style.top = `${smoothPointerY + dragOffsetY}px`;
          } else {
            activeDraggingWindow = null;
          }
        }

        if (!isPinching) {
          isContentScrolling = false;
        }

        drawLaserRay(originX, originY, smoothPointerX, smoothPointerY, isPinching, isHoveringAny);
        wasPinching = isPinching;

      } else {
        activeDraggingWindow = null;
        isContentScrolling = false;
        wasPinching = false;
      }

      canvasCtx.restore();
    });

    function createAppWindow(appName, url) {
      const windowEl = document.createElement('div');
      windowEl.className = 'app-window';
      // Posiciona no topo/centro para não tampar o dock
      windowEl.style.left = `${Math.max(10, (window.innerWidth - 480) / 2)}px`;
      windowEl.style.top = `60px`;

      windowEl.innerHTML = `
        <div class="window-header">
          <span>${appName}</span>
          <button class="close-btn">✕</button>
        </div>
        <iframe class="window-body" src="${url}"></iframe>
        <div class="window-grab-bar">
          <div class="grab-pill"></div>
        </div>
      `;

      windowsContainer.appendChild(windowEl);
    }

    function drawHandMesh(landmarks) {
      for (const connection of HAND_CONNECTIONS) {
        const from = landmarks[connection[0]];
        const to = landmarks[connection[1]];
        canvasCtx.beginPath();
        canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
        canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
        canvasCtx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        canvasCtx.lineWidth = 3;
        canvasCtx.stroke();
      }
      for (const landmark of landmarks) {
        canvasCtx.beginPath();
        canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 4.5, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#38bdf8';
        canvasCtx.fill();
      }
    }

    function drawLaserRay(startX, startY, endX, endY, isPinching, isHovering) {
      let colorCore = isPinching ? '#22c55e' : (isHovering ? '#38bdf8' : '#ffffff');
      canvasCtx.beginPath();
      canvasCtx.moveTo(startX, startY);
      canvasCtx.lineTo(endX, endY);
      canvasCtx.strokeStyle = colorCore;
      canvasCtx.lineWidth = isPinching ? 6 : 3;
      canvasCtx.stroke();

      canvasCtx.beginPath();
      canvasCtx.arc(endX, endY, isPinching ? 6 : 9, 0, 2 * Math.PI);
      canvasCtx.fillStyle = colorCore;
      canvasCtx.fill();
    }

    async function startCamera() {
      startBtn.style.display = 'none';
      createAppWindow('Wikipédia', 'https://pt.m.wikipedia.org');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }
        });
        videoElement.srcObject = stream;
        await videoElement.play();
        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();
      } catch (err) {
        statusLog.innerText = "Erro na câmera: " + err.message;
      }
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
