<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Quest Spatial OS - Google & YouTube</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .a-enter-vr { display: none !important; }

    /* Canvas do Laser e da Mão (Fica por cima de tudo) */
    #hand_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      pointer-events: none;
    }

    /* Botão Inicial */
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.5);
    }

    /* Botões da Interface */
    #controls-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      gap: 12px;
    }

    .ui-btn {
      padding: 12px 22px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .ui-btn.youtube {
      background: rgba(220, 38, 38, 0.85);
      border-color: #f87171;
    }

    .ui-btn.google {
      background: rgba(2, 132, 199, 0.85);
      border-color: #38bdf8;
    }

    #statusLog {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      color: #cbd5e1;
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.88);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    video { display: none; }
  </style>
</head>
<body>

  <button id="startBtn">Iniciar AR (Ativar Câmera)</button>
  
  <div id="controls-container" style="display: none;">
    <button class="ui-btn google" id="btnOpenGoogle">🔍 Google</button>
    <button class="ui-btn youtube" id="btnOpenYT">▶️ YouTube</button>
    <button class="ui-btn" id="recenterUIBtn">🎯 Recentralizar</button>
  </div>

  <div id="statusLog">Meta Quest AR - Controle por Mãos</div>
  
  <video id="webcam" playsinline></video>
  <canvas id="hand_canvas"></canvas>

  <a-scene embedded vr-mode-ui="enabled: false">
    
    <a-entity id="main-camera" camera look-controls="magicWindowTrackingEnabled: true"></a-entity>

    <a-entity id="spatial-world">
      
      <a-plane id="window-google" position="-1 0.2 -2" width="1.5" height="1" material="shader: flat; color: #ffffff; opacity: 0.95; transparent: true">
        <a-text value="Google" position="-0.3 0.3 0.01" scale="0.8 0.8 0.8" color="#4285F4"></a-text>
        <a-plane position="0 -0.05 0.01" width="1.2" height="0.15" material="color: #f1f3f4; shader: flat;">
          <a-text value="Pesquisar no Google..." position="-0.5 0 0.01" scale="0.3 0.3 0.3" color="#5f6368"></a-text>
        </a-plane>
        <a-text value="Clique no botao abaixo para abrir" position="-0.5 -0.3 0.01" scale="0.3 0.3 0.3" color="#1a0dab"></a-text>
      </a-plane>

      <a-plane id="window-youtube" position="1 0.2 -2" width="1.5" height="1" material="shader: flat; color: #0f0f0f; opacity: 0.95; transparent: true">
        <a-text value="YouTube" position="-0.35 0.3 0.01" scale="0.8 0.8 0.8" color="#FF0000"></a-text>
        <a-plane position="0 -0.05 0.01" width="1.3" height="0.5" material="color: #212121; shader: flat;">
          <a-text value="▶️ Clique no botao abaixo para abrir" position="-0.55 0 0.01" scale="0.3 0.3 0.3" color="#ffffff"></a-text>
        </a-plane>
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCanvas = document.getElementById('hand_canvas');
    const handCtx = handCanvas.getContext('2d');
    
    const startBtn = document.getElementById('startBtn');
    const controlsContainer = document.getElementById('controls-container');
    const statusLog = document.getElementById('statusLog');
    
    const cameraEntity = document.getElementById('main-camera');
    const windowGoogle = document.getElementById('window-google');
    const windowYouTube = document.getElementById('window-youtube');

    let smoothPointerX = window.innerWidth / 2;
    let smoothPointerY = window.innerHeight / 2;
    let isPinching = false;

    // AÇÕES DOS BOTÕES DA UI (Abrem Google e YouTube)
    document.getElementById('btnOpenGoogle').addEventListener('click', () => {
      window.open('https://www.google.com', '_blank');
    });

    document.getElementById('btnOpenYT').addEventListener('click', () => {
      window.open('https://www.youtube.com', '_blank');
    });

    // RECENTRALIZAR AS JANELAS NA SUA FRENTE
    document.getElementById('recenterUIBtn').addEventListener('click', () => {
      const cameraObj = cameraEntity.object3D;
      
      const dirG = new THREE.Vector3(-0.8, 0, -2);
      dirG.applyQuaternion(cameraObj.quaternion);
      windowGoogle.object3D.position.copy(cameraObj.position).add(dirG);
      windowGoogle.object3D.quaternion.copy(cameraObj.quaternion);

      const dirYT = new THREE.Vector3(0.8, 0, -2);
      dirYT.applyQuaternion(cameraObj.quaternion);
      windowYouTube.object3D.position.copy(cameraObj.position).add(dirYT);
      windowYouTube.object3D.quaternion.copy(cameraObj.quaternion);

      statusLog.innerText = "Telas do Google e YouTube alinhadas!";
    });

    // MEDIAPIPE HANDS (RASTREAMENTO DA MÃO E CÂMERA)
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      handCanvas.width = window.innerWidth;
      handCanvas.height = window.innerHeight;

      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        drawHandMesh(landmarks);

        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];
        const indexBase = landmarks[5];
        const middleTip = landmarks[12];

        const originX = indexTip.x * handCanvas.width;
        const originY = indexTip.y * handCanvas.height;
        const dirX = (indexTip.x - indexBase.x) * 3.5;
        const dirY = (indexTip.y - indexBase.y) * 3.5;

        const targetX = (indexTip.x + dirX) * handCanvas.width;
        const targetY = (indexTip.y + dirY) * handCanvas.height;

        smoothPointerX += (targetX - smoothPointerX) * 0.25;
        smoothPointerY += (targetY - smoothPointerY) * 0.25;

        const palmWidth = Math.hypot(landmarks[5].x - landmarks[17].x, landmarks[5].y - landmarks[17].y);
        const pinchDistance = Math.hypot(thumbTip.x - middleTip.x, thumbTip.y - middleTip.y);
        isPinching = (pinchDistance / palmWidth) < 0.32;

        drawLaserRay(originX, originY, smoothPointerX, smoothPointerY, isPinching);
      }

      handCtx.restore();
    });

    function drawHandMesh(landmarks) {
      for (const connection of HAND_CONNECTIONS) {
        const from = landmarks[connection[0]];
        const to = landmarks[connection[1]];
        handCtx.beginPath();
        handCtx.moveTo(from.x * handCanvas.width, from.y * handCanvas.height);
        handCtx.lineTo(to.x * handCanvas.width, to.y * handCanvas.height);
        handCtx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        handCtx.lineWidth = 3;
        handCtx.stroke();
      }
    }

    function drawLaserRay(startX, startY, endX, endY, pinching) {
      let colorCore = pinching ? '#22c55e' : '#38bdf8';
      
      handCtx.beginPath();
      handCtx.moveTo(startX, startY);
      handCtx.lineTo(endX, endY);
      handCtx.strokeStyle = colorCore;
      handCtx.lineWidth = pinching ? 6 : 3;
      handCtx.stroke();

      handCtx.beginPath();
      handCtx.arc(endX, endY, pinching ? 6 : 9, 0, 2 * Math.PI);
      handCtx.fillStyle = colorCore;
      handCtx.fill();
    }

    // INICIAR A CÂMERA DO CELULAR
    async function startApp() {
      startBtn.style.display = 'none';
      controlsContainer.style.display = 'flex';

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch(e) {}
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();
        statusLog.innerText = "Câmera e Laser ativados com sucesso!";
      } catch (err) {
        statusLog.innerText = "⚠️ Erro na Câmera: Permita o acesso no navegador.";
        console.error("Erro Câmera:", err);
      }
    }

    startBtn.addEventListener('click', startApp);
  </script>
</body>
</html>
