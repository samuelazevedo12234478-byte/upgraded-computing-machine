<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Mão - Câmera Traseira</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
    }

    /* O vídeo fica oculto; desenhamos tudo no Canvas */
    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background-color: #000;
      transform: scaleX(1); /* Não espelhado para câmera traseira */
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Mapeamento de Mão (Câmera Traseira)</h1>
  
  <div class="container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // Configuração do detector de mãos do MediaPipe
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Função executada a cada frame processado
    hands.onResults((results) => {
      // Ajusta o tamanho do canvas para o tamanho do vídeo
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Desenha a imagem da câmara no fundo
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // Se identificar mãos, desenha os pontos e conexões
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          
          // Desenhar conexões entre os pontos da mão
          for (const connection of HAND_CONNECTIONS) {
            const from = landmarks[connection[0]];
            const to = landmarks[connection[1]];
            
            canvasCtx.beginPath();
            canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
            canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
            canvasCtx.strokeStyle = '#00FF88'; // Cor estilo Quest (Verde Neon)
            canvasCtx.lineWidth = 3;
            canvasCtx.stroke();
          }

          // Desenhar os pontos das articulações
          for (const landmark of landmarks) {
            const x = landmark.x * canvasElement.width;
            const y = landmark.y * canvasElement.height;

            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#FF0055'; // Cor dos pontos
            canvasCtx.fill();
          }
        }
      }
      canvasCtx.restore();
    });

    // Configuração para utilizar a CÂMERA TRASEIRA ('environment')
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" } // Força o uso da câmera traseira
          }
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        // Loop de processamento de frames
        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        console.warn("Não foi possível acessar a câmera traseira exata. Tentando modo padrão...", err);
        // Fallback caso o dispositivo não suporte a regra 'exact' (ex: notebooks)
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          videoElement.srcObject = stream;
          await videoElement.play();
          
          const processFrame = async () => {
            await hands.send({ image: videoElement });
            requestAnimationFrame(processFrame);
          };
          processFrame();
        } catch (error) {
          alert("Erro ao acessar a câmera: " + error.message);
        }
      }
    }

    initCamera();
  </script>
</body>
</html>
