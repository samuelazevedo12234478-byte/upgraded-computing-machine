<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreamento de Mão - Câmera Traseira</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background-color: #000;
    }

    #startBtn {
      position: absolute;
      z-index: 10;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #errorLog {
      position: absolute;
      bottom: 10px;
      color: #ff5555;
      font-size: 0.9rem;
      text-align: center;
      padding: 0 10px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Mapeamento de Mão (Câmera Traseira)</h1>
  
  <div class="container">
    <button id="startBtn">Iniciar Câmera</button>
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div id="errorLog"></div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const errorLog = document.getElementById('errorLog');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          
          for (const connection of HAND_CONNECTIONS) {
            const from = landmarks[connection[0]];
            const to = landmarks[connection[1]];
            
            canvasCtx.beginPath();
            canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
            canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
            canvasCtx.strokeStyle = '#00FF88';
            canvasCtx.lineWidth = 3;
            canvasCtx.stroke();
          }

          for (const landmark of landmarks) {
            const x = landmark.x * canvasElement.width;
            const y = landmark.y * canvasElement.height;

            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#FF0055';
            canvasCtx.fill();
          }
        }
      }
      canvasCtx.restore();
    });

    async function startCamera() {
      startBtn.style.display = 'none';
      errorLog.innerText = '';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });
        
        videoElement.srcObject = stream;
        await videoElement.play();

        const processFrame = async () => {
          if (!videoElement.paused && !videoElement.ended) {
            await hands.send({ image: videoElement });
          }
          requestAnimationFrame(processFrame);
        };
        processFrame();

      } catch (err) {
        console.error(err);
        errorLog.innerText = "Erro ao acessar a câmera: " + err.message + ". Certifique-se de permitir o acesso à câmera.";
        startBtn.style.display = 'block';
      }
    }

    startBtn.addEventListener('click', startCamera);
  </script>
</body>
</html>
